name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Godot 4.4
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          sudo mv Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Download Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          unzip -q Godot_v4.4-stable_export_templates.tpz
          VERSION_DIR=$(cat templates/version.txt | tr -d '\n\r ')
          echo "نسخه: [$VERSION_DIR]"
          mkdir -p ~/.local/share/godot/export_templates/$VERSION_DIR
          mv templates/* ~/.local/share/godot/export_templates/$VERSION_DIR/
          echo "=== محتوای پوشه تمپلیت ==="
          ls ~/.local/share/godot/export_templates/$VERSION_DIR/ | head -10

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true
          echo "=== SDK نصب شد ==="
          ls $HOME/android-sdk/

      - name: Setup Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$HOME/android-sdk"
          export/android/debug_keystore = "$HOME/.config/godot/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.config/godot
          keytool -genkeypair -v -keystore ~/.config/godot/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Show project structure
        run: |
          echo "=== ریشه پروژه ==="
          ls -la
          echo "=== محتوای project.godot ==="
          cat project.godot | head -30
          echo "=== صحنه‌ها ==="
          find . -name "*.tscn" -not -path "./.git/*" -not -path "./.godot/*"

      - name: Generate .godot cache
        run: |
          timeout 180 godot --headless --path . --import 2>&1 || true
          echo "=== پوشه .godot ==="
          ls -la .godot/ 2>&1 | head -10

      - name: Export APK
        run: |
          mkdir -p builds/android
          godot --headless --path . --export-debug "Android" builds/android/game.apk
          echo "=== فایل‌های ساخته شده ==="
          ls -la builds/android/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Naftkesh-APK
          path: builds/android/game.apk
          if-no-files-found: error
